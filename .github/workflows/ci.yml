name: CI

on:
  push:
    branches: [master, main, dev, dev2]
  pull_request:
    branches: [master, main, dev, dev2]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: i18n catalogs
        run: npm run i18n:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; real API URL is injected at deploy/runtime
          VITE_API_URL: https://app.nurcrm.kg/api
